[package]
name = "cxx_importer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "libclang-driven C++ header importer for rustcc."

[dependencies]
rustc_abi_cxx = { path = "../rustc_abi_cxx" }
# The `runtime` feature makes clang-sys dlopen libclang at runtime via
# libloading, so the binary doesn't need libclang on its rpath at build
# time. LIBCLANG_PATH env var, xcrun, and standard paths are searched.
# `clang_3_7` unlocks `Type::get_fields()`, which we use as a reliable
# field enumerator that works on template specializations too.
# `clang_5_0` unlocks `Entity::get_exception_specification()` for
# `noexcept` extraction in `import::lower_method`.
clang = { version = "2.0", optional = true, features = ["runtime", "clang_3_7", "clang_5_0"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
# `cache` feature pulls these in; without it the cache module is
# inert.
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
# `build` feature pulls this in; the cargo `build.rs` orchestrator
# uses `cc` to compile the emitted C++ shims into a static lib that
# the user's crate then links against.
cc = { version = "1.2", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
# Gate libclang linkage behind a feature so the skeleton builds on
# machines without a system libclang. Tests for the real importer path
# compile only when this feature is enabled.
libclang = ["dep:clang"]
# M10 (incremental compilation). When enabled, `Driver::load_or_parse`
# can serialize / deserialize the parsed `CxxTypeCtx` to disk between
# build.rs runs, keyed on header content + clang flags + version
# stamps. Pulls in serde derives across the IR via
# `rustc_abi_cxx/serde`.
cache = ["rustc_abi_cxx/serde", "dep:serde_json", "dep:sha2"]
# M26 (build-system integration). Exposes `cxx_importer::build::Build`
# — a `cc::Build`-style orchestrator for `build.rs` files. Drives the
# importer + bindings emitter + shim emitter + a C++ compile step
# end-to-end so downstream crates close the click-run-see-a-window
# gap with a few lines of `build.rs`. Pulls in `libclang` (parser)
# and `cc` (C++ compile driver).
build = ["libclang", "dep:cc", "dep:serde_json"]
