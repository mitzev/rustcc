[package]
name = "rustcc_codegen"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Adapter layer between a rustc fork and the rustcc IR. Defines the
# provider traits the fork implements (LayoutProvider, ManglerProvider,
# ShimResolver) and the call-lowering logic that builds ABI-correct
# extern-C invocations for `extern "C++"` call sites. Today it exposes
# an in-memory test harness; the rustc fork will wrap this same API
# around `TyCtxt`.

[dependencies]
rustc_abi_cxx = { path = "../rustc_abi_cxx" }
