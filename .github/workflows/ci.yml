name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  workspace-test:
    name: cargo test --workspace (stock nightly)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v5  # Node 24 (v4 was Node 20 / deprecated)

      # rust-toolchain.toml pins the nightly this workspace builds with.
      # rustup will honor it automatically on the first cargo invocation.
      - name: Show toolchain
        run: |
          rustup show active-toolchain || true
          cargo --version
          rustc --version

      - name: Install system deps (clang for clang-sys / cxx_importer)
        run: |
          sudo apt-get update
          # clang + libclang: clang-sys / cxx_importer libclang bindings.
          # libc++ + libc++abi: the cxx_throws_phase0 runtime test links
          # its C++ shim with `-lc++` (LLVM libc++); without these the
          # Linux runner only has libstdc++ and the test fails to link
          # (`rust-lld: error: unable to find library -lc++`).
          sudo apt-get install -y clang libclang-dev libc++-dev libc++abi-dev

      - uses: Swatinem/rust-cache@v2.9.1  # Node 24 (v2 floating tag may still pull older Node 20 patch)

      - name: cargo build --workspace
        run: cargo build --workspace --locked

      - name: cargo test --workspace
        run: cargo test --workspace --locked

      # v1.12.22: gate the cxx_throws_demo example. The demo
      # lives outside the workspace (separate Cargo.toml) so
      # `cargo test --workspace` doesn't reach it. Build + run
      # it here so the throws-system end-to-end pipeline can't
      # bit-rot between releases — if a future refactor breaks
      # the orchestrator's annotation harvest or shim emission,
      # this step catches it on PR.
      - name: cargo run -p cxx_throws_demo
        working-directory: examples/cxx_throws_demo
        run: |
          cargo build --locked
          cargo run --locked

  # v1.14.x: the same workspace suite on a g++/libstdc++ host — the
  # default toolchain of every mainstream Linux distro. libclang is
  # still installed (the importer PARSES with it), but all C++
  # compilation + linking goes through g++ and GNU libstdc++: the
  # toolchain-aware test helper (tests/common/mod.rs) honors $CXX and
  # swaps -stdlib=libc++/-lc++ for the libstdc++ defaults. Deliberately
  # NO libc++-dev here, so any libc++ dependency that creeps back in
  # fails this leg.
  workspace-test-gcc:
    name: cargo test --workspace (g++ / libstdc++)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -Dwarnings
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchains
        run: |
          rustup show active-toolchain || true
          g++ --version | head -1

      - name: Install system deps (libclang for parsing; g++ for codegen)
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ clang libclang-dev

      - uses: Swatinem/rust-cache@v2.9.1
        with:
          key: gcc

      - name: cargo build --workspace
        run: cargo build --workspace --locked

      - name: cargo test --workspace
        run: cargo test --workspace --locked

      - name: cargo run -p cxx_throws_demo (g++ shims, libstdc++)
        working-directory: examples/cxx_throws_demo
        run: |
          cargo build --locked
          cargo run --locked

  patches-apply:
    name: fork/patches apply cleanly on pinned nightly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5  # Node 24 (v4 was Node 20 / deprecated)

      - name: Run fork/build.sh --apply-only
        run: ./fork/build.sh --apply-only

  # v1.13.0 P09.71: gate the native-invoke smoke tests behind a
  # workflow_dispatch trigger. Both jobs need either a built fork
  # rustc (~30 min on a clean runner) or a pre-built artifact, so
  # we don't run them on every PR — they're for release-cycle
  # validation. The job recipes are kept here so they can't
  # bit-rot, and a maintainer can trigger them on demand.
  cxx-throws-native-itanium:
    name: fork rustc + cxx_throws native invoke (linux Itanium)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space (Linux)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go || true
          sudo docker image prune --all --force || true

      - name: System deps (clang + C++ runtime)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev libc++-dev libc++abi-dev

      - name: Build fork rustc stage-1
        env:
          # 1.96.0 release-tag CI LLVM is still served — skip the
          # ~90 min from-source LLVM build that exhausts free runners.
          RUSTCC_DOWNLOAD_CI_LLVM: "1"
          CLONE_DIR: ${{ github.workspace }}/../rust-lang-rust-fork
          # Bootstrap's CiEnv::GitHubActions path resolves HEAD^1 as
          # "the upstream commit" — wrong for our am'd patch stack
          # (HEAD^1 = previous fork patch). Force the local
          # author-date-order bors lookup, which resolves the served
          # LLVM-bump commit.
          GITHUB_ACTIONS: "false"
        run: ./fork/build.sh

      - name: Build the cxx_throws_native example
        working-directory: examples/cxx_throws_native
        env:
          RUSTC: ${{ github.workspace }}/../rust-lang-rust-fork/build/host/stage1/bin/rustc
        run: |
          cargo build --release --locked

      - name: Run the cxx_throws_native example
        working-directory: examples/cxx_throws_native
        run: |
          ./target/release/cxx_throws_native

  # v1.14.x: full fork-rustc e2e with the C++ side built by g++ —
  # subclass an imported base (+ deep chain, member ptrs, dtor
  # position) and catch g++/libstdc++-thrown exceptions natively.
  # Same dispatch-only gating as the other stage-1 legs (~30 min
  # fork build on a clean runner).
  subclass-e2e-gcc:
    name: fork rustc + subclass/throws e2e (g++ / libstdc++)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space (Linux)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go || true
          sudo docker image prune --all --force || true

      - name: System deps (libclang for parsing; g++ for codegen)
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ clang libclang-dev

      - name: Build fork rustc stage-1
        env:
          RUSTCC_DOWNLOAD_CI_LLVM: "1"
          CLONE_DIR: ${{ github.workspace }}/../rust-lang-rust-fork
          # Bootstrap's CiEnv::GitHubActions path resolves HEAD^1 as
          # "the upstream commit" — wrong for our am'd patch stack
          # (HEAD^1 = previous fork patch). Force the local
          # author-date-order bors lookup, which resolves the served
          # LLVM-bump commit.
          GITHUB_ACTIONS: "false"
        run: ./fork/build.sh

      - name: Run the subclass + member-ptr demos with g++
        env:
          RUSTC: ${{ github.workspace }}/../rust-lang-rust-fork/build/host/stage1/bin/rustc
        run: |
          for d in subclass_cpp_base subclass_cpp_deep member_fn_ptr subclass_dtor_position; do
            echo "==> $d (CXX=$CXX)"
            ./examples/$d/build_demo.sh
          done

      - name: Build + run cxx_throws_native with g++
        working-directory: examples/cxx_throws_native
        env:
          RUSTC: ${{ github.workspace }}/../rust-lang-rust-fork/build/host/stage1/bin/rustc
        run: |
          cargo build --release --locked
          ./target/release/cxx_throws_native

  # v1.15: the GCC *backend* e2e — Rust compiled by
  # -Zcodegen-backend=gcc (libgccjit, CI-downloaded), C++ by g++; the
  # subclass_cpp_base demo must pass with zero LLVM involvement in
  # Rust codegen. Builds stage1 in-tree (x.py) rather than via
  # fork/build.sh because the gcc backend + ci-gcc download are
  # bootstrap-level options.
  subclass-e2e-cg-gcc:
    name: fork rustc (cg_gcc backend) + subclass e2e (pure GCC)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space (Linux)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go || true
          sudo docker image prune --all --force || true

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ clang libclang-dev cmake ninja-build \
                                  pkg-config libssl-dev

      - name: Clone rust 1.96.0 + apply fork patches
        env:
          CLONE_DIR: ${{ github.workspace }}/../rust-lang-rust-fork
        run: ./fork/build.sh --apply-only

      - name: Build stage1 with the gcc codegen backend
        working-directory: ../rust-lang-rust-fork
        env:
          GITHUB_ACTIONS: "false"   # see the build.sh steps' note
        run: |
          ./x.py build --stage 1 library \
            --set 'rust.codegen-backends=["llvm","gcc"]' \
            --set gcc.download-ci-gcc=true \
            --set llvm.download-ci-llvm=true

      - name: Run subclass_cpp_base under -Zcodegen-backend=gcc
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/../rust-lang-rust-fork/build/x86_64-unknown-linux-gnu/ci-gcc/lib
        run: |
          R="$GITHUB_WORKSPACE/../rust-lang-rust-fork/build/host/stage1/bin/rustc"
          cd examples/subclass_cpp_base
          cargo run --bin gen_bindings --release
          "$R" --edition 2024 -Zcodegen-backend=gcc --crate-type staticlib \
               --crate-name subclass_cpp_base src/mywidget.rs -o target/libsub_gcc.a
          g++ -std=c++17 -c cpp/cppbase.cpp -o target/cppbase.o
          g++ -std=c++17 -c caller.cpp -o target/caller.o
          gcc -c runner.c -o target/runner.o
          g++ target/runner.o target/caller.o target/cppbase.o \
              target/libsub_gcc.a -o target/demo_gcc
          ./target/demo_gcc

  cxx-throws-native-msvc-wine:
    name: fork rustc + cxx_throws native invoke (x86_64-pc-windows-msvc under Wine)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space (Linux)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go || true
          sudo docker image prune --all --force || true

      - name: System deps (wine + clang + xwin)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine wine64 clang lld
          cargo install xwin --locked
          xwin --accept-license splat --output ~/.xwin

      - name: Build fork rustc stage-1
        env:
          RUSTCC_DOWNLOAD_CI_LLVM: "1"
          CLONE_DIR: ${{ github.workspace }}/../rust-lang-rust-fork
          # Bootstrap's CiEnv::GitHubActions path resolves HEAD^1 as
          # "the upstream commit" — wrong for our am'd patch stack
          # (HEAD^1 = previous fork patch). Force the local
          # author-date-order bors lookup, which resolves the served
          # LLVM-bump commit.
          GITHUB_ACTIONS: "false"
        run: ./fork/build.sh

      - name: Run the MSVC runtime smoke suite under Wine
        env:
          RUSTCC_STAGE1: ${{ github.workspace }}/../rust-lang-rust-fork/build/host/stage1
        run: ./fork/tests/run_msvc_runtime.sh
