name: Release rust-analyzer-rustcc binaries

# Builds the patched rust-analyzer for each supported host triple and
# uploads tarballs as release assets alongside the rustcc toolchain
# (release.yml). Triggered by:
#   - Pushing a tag matching `v*` (e.g. `v1.07.0`), shared with release.yml
#   - Manual `workflow_dispatch` with a release tag input
#
# Output: `rust-analyzer-rustcc-<triple>.tar.xz` on the same GitHub
# release as the rustcc toolchain. Users install via:
#
#   $ rustcc install              # rustcc fork toolchain
#   $ vscode: "rustcc: Install RA Fork"   # downloads + sets server.path

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch/tag/sha); default uses the dispatched ref'
        required: false
        default: ''
      release_tag:
        description: 'Release tag to publish to. Required for dispatch runs.'
        required: false
        default: ''

jobs:
  build:
    name: Build RA fork ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          # x86_64-apple-darwin (Intel mac) is intentionally dropped:
          # GitHub's `macos-13` runners are heavily contended and this
          # job routinely queues for hours (6h+ observed on v1.13.7),
          # stalling the whole RA release. The toolchain release
          # (release.yml) already drops Intel-mac for the same reason,
          # so the RA plugin matrix now matches the shipped toolchain
          # platforms. Re-enable if/when Intel-mac runners free up.
          # - os: macos-13
          #   target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      # rust-analyzer pins its build to a specific rust-lang/rust
      # commit via a `rust-version` file. Trying to compile RA's
      # tree against any stock nightly (latest or rustcc's pinned
      # nightly-2025-10-03) fails: either `if let` guards aren't
      # stable yet (old), or `extern crate rustc_abi` is no longer
      # public (new). RA's own CI works around this with
      # `rustup-toolchain-install-master` — installs rustc + cargo
      # built at a specific git SHA, then sets RUSTC_BOOTSTRAP=1 to
      # emulate a "nightly" channel. Mirror that here.
      - name: Resolve RA's pinned rustc SHA
        id: ra-version
        run: |
          # The build.sh script clones RA and writes `rust-version` to
          # the clone root. We pre-fetch the SHA here so the toolchain
          # install can run BEFORE build.sh, avoiding a chicken-and-egg
          # ordering issue.
          RA_SHA=$(curl -fsSL \
            "https://raw.githubusercontent.com/rust-lang/rust-analyzer/$(cat fork/ra-patches/PINNED_COMMIT)/rust-version")
          echo "sha=$RA_SHA" >> "$GITHUB_OUTPUT"
          echo "RA pinned rustc SHA: $RA_SHA"

      - name: Install rustup-toolchain-install-master
        run: cargo install rustup-toolchain-install-master@1.11.0

      - name: Install RA's pinned rustc
        run: |
          RA_SHA="${{ steps.ra-version.outputs.sha }}"
          rustup-toolchain-install-master "$RA_SHA" -c cargo -c rust-src
          rustup default "$RA_SHA"

      - name: Cache RA build
        # v5 is the first Node 24 major; v4 ran Node 20 which
        # GitHub deprecated for hosted runners.
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ra-fork-${{ matrix.target }}-${{ hashFiles('fork/ra-patches/*.patch', 'fork/ra-patches/PINNED_COMMIT') }}
          restore-keys: |
            ra-fork-${{ matrix.target }}-

      - name: Build patched rust-analyzer
        env:
          # Outside the workspace so cargo doesn't pick up rustcc's
          # workspace `rust-toolchain.toml`. We just installed RA's
          # exact pinned rustc via rustup-toolchain-install-master
          # and set it as the default — that's what cargo should use.
          RA_CLONE_DIR: ${{ runner.temp }}/rust-analyzer-rustcc
          # Emulate a nightly channel — same as RA's own CI does.
          # The toolchain we installed reports a stable-flavored
          # version string, but it's built from the rust-lang/rust
          # nightly tree, so it has every nightly feature available.
          RUSTC_BOOTSTRAP: "1"
        run: |
          ./fork/ra-patches/build.sh
          test -x "$RA_CLONE_DIR/target/release/rust-analyzer"

      - name: Package
        env:
          RA_CLONE_DIR: ${{ runner.temp }}/rust-analyzer-rustcc
        run: |
          # Tarball the binary with a small wrapper README so users
          # know what they got.
          STAGE_DIR="$(mktemp -d)/rust-analyzer-rustcc"
          mkdir -p "$STAGE_DIR"
          cp "$RA_CLONE_DIR/target/release/rust-analyzer" "$STAGE_DIR/"
          cat > "$STAGE_DIR/README.md" <<'EOF'
          # rust-analyzer-rustcc

          Patched rust-analyzer with rustcc Phase-2 support for the
          `class` keyword. Drop-in replacement for upstream RA.

          To use:

              # macOS / Linux
              chmod +x rust-analyzer
              # Then point your editor at the binary:
              # VS Code (settings.json):
              #   "rust-analyzer.server.path": "/path/to/rust-analyzer"

          See the rustcc repo's `fork/ra-patches/` for the patch
          series this binary was built from.
          EOF

          ARCHIVE="rust-analyzer-rustcc-${{ matrix.target }}.tar.xz"
          tar -cJf "$ARCHIVE" -C "$(dirname "$STAGE_DIR")" "$(basename "$STAGE_DIR")"
          ls -lh "$ARCHIVE"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256" 2>/dev/null \
            || shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Upload artifact (job-scoped)
        uses: actions/upload-artifact@v6
        with:
          name: rust-analyzer-rustcc-${{ matrix.target }}
          path: |
            rust-analyzer-rustcc-${{ matrix.target }}.tar.xz
            rust-analyzer-rustcc-${{ matrix.target }}.tar.xz.sha256
          retention-days: 30

      - name: Upload to GitHub Release
        if: >
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TAG" \
              --notes "Prebuilt rustcc toolchain for tag $TAG."
          fi
          gh release upload "$TAG" \
            "rust-analyzer-rustcc-${{ matrix.target }}.tar.xz" \
            "rust-analyzer-rustcc-${{ matrix.target }}.tar.xz.sha256" \
            --clobber
