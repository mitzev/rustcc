# Cross-link config for the v1.09.2 MSVC runtime smoke test.
#
# Requires:
# - `lld-link` on PATH (`brew install lld` provides it).
# - `xwin` SDK splatted to `$HOME/.xwin/` via
#   `cargo install xwin && xwin --accept-license splat -o ~/.xwin`.
#
# The xwin -Lnative search paths + /subsystem:console + the
# pre-compiled maybe_throws.lib flags all come from the runner
# script via CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS —
# config.toml can't expand $HOME, and hardcoding an absolute
# home here broke every machine that wasn't the author's (the
# CI runner's lld-link couldn't find kernel32.lib).
[target.x86_64-pc-windows-msvc]
linker = "lld-link"
