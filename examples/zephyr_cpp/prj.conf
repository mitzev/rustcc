# Zephyr C++ interop probe config.
# C++17 on; RTTI/exceptions stay OFF (the cross-boundary RTTI rides
# the fork-emitted _ZTI metadata + rtti_stub.c, exactly as the
# FreeRTOS probe compiles caller.cpp with -fno-rtti -fno-exceptions).
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=4096
